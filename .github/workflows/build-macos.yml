name: Build macOS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install UPX
        run: brew install upx

      - name: Build libft
        run: make -C src/wrapper/libft

      - name: Compile py2c wrapper
        run: gcc src/wrapper/py2c.c -Isrc -Lsrc/wrapper/libft -lft -o py2c

      - name: Build binary
        run: ./py2c assembleRelease --target=macos

      - name: Verify project structure
        run: ./py2c verify --allow-built --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: werdeep-macos-x64
          path: |
            dist/werdeep-macos-x64
            dist/libpython3.11.dylib
          retention-days: 30

      - name: Test binary
        run: |
          chmod +x dist/werdeep-macos-x64
          ./dist/werdeep-macos-x64 --help
          ./dist/werdeep-macos-x64 "https://example.com" --depth 1 --max-pages 1 --timeout 30

      - name: Get binary size
        run: ls -lh dist/werdeep-macos-x64

  build-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install UPX
        run: brew install upx

      - name: Build libft
        run: make -C src/wrapper/libft

      - name: Compile py2c wrapper
        run: gcc src/wrapper/py2c.c -Isrc -Lsrc/wrapper/libft -lft -o py2c

      - name: Build binary
        run: ./py2c assembleRelease --target=macos-arm64

      - name: Verify project structure
        run: ./py2c verify --allow-built --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: werdeep-macos-arm64
          path: |
            dist/werdeep-macos-arm64
            dist/libpython3.11.dylib
          retention-days: 30

      - name: Test binary
        run: |
          chmod +x dist/werdeep-macos-arm64
          ./dist/werdeep-macos-arm64 --help
          ./dist/werdeep-macos-arm64 "https://example.com" --depth 1 --max-pages 1 --timeout 30

      - name: Get binary size
        run: ls -lh dist/werdeep-macos-arm64
